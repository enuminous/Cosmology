name: Verify frozen cosmology package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Check archive identity and reproduce calculations
        run: python tools/verify_publication.py --output publication/latest-verification.json
      - name: Preserve verification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmology-verification
          path: publication/latest-verification.json
          if-no-files-found: warn
