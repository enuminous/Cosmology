name: Verify standalone Horizon app

on:
  push:
    branches: [main]
    paths: ['index.html', 'webapp/**', '.github/workflows/horizon-webapp.yml', 'results/background.csv']
  pull_request:
    paths: ['index.html', 'webapp/**', '.github/workflows/horizon-webapp.yml', 'results/background.csv']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify standalone physics and packaging
        run: node webapp/test.cjs
      - name: Verify the generated file and original freeze
        run: |
          python3 webapp/build.py
          git diff --exit-code -- index.html
          python3 src/check_freeze.py
