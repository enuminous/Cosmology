name: Verify observational publication

on:
  push:
    branches: [main]
    paths:
      - 'observational/**'
      - 'publication/observational-2026-10-25.json'
      - 'tools/verify_observational_publication.py'
      - '.github/workflows/observational-publication.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify and prepare observational bundle
        run: python tools/verify_observational_publication.py --prepare
      - name: Verify original numerical freeze
        run: python src/check_freeze.py
      - name: Confirm tracked files were preserved
        run: git diff --exit-code
